<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    Increased viewBox to 200x200 to add significant whitespace around the items.
    Items are small relative to the box to ensure "very less" frequency.
  -->
  
  <!-- Spoon -->
  <g transform="translate(60, 60) rotate(45)">
    <ellipse cx="0" cy="-10" rx="6" ry="9" stroke="white" stroke-width="1.5" fill="none"/>
    <line x1="0" y1="-1" x2="0" y2="20" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Fork -->
  <g transform="translate(140, 70) rotate(-30)">
    <path d="M-5 -15 v10 a5 5 0 0 0 10 0 v-10 M0 -15 v10 M0 -5 v25" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Butter Knife -->
  <g transform="translate(100, 140) rotate(90)">
    <!-- Rounded tip for butter knife -->
    <path d="M0 -20 q4 0 4 20 l-4 15 l-4 -15 q0 -20 4 -20" stroke="white" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
  </g>
</svg>
